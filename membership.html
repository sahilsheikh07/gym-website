<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Membership | Oxygen Gym</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,
  <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 512'>
  <path fill='%23dc3545'
  d='M96 96c-17.7 0-32 14.3-32 32v64H32c-17.7 0-32 14.3-32 32v64c0 17.7 14.3 32 32 32h32v64c0 17.7 14.3 32 32 32s32-14.3 32-32v-64h320v64c0 17.7 14.3 32 32 32s32-14.3 32-32v-64h32c17.7 0 32-14.3 32-32v-64c0-17.7-14.3-32-32-32h-32v-64c0-17.7-14.3-32-32-32s-32 14.3-32 32v64H128v-64c0-17.7-14.3-32-32-32z'/>
  </svg>"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/membership.css" />
  </head>

  <body>
    <!-- ===== Navbar ===== -->
    <div id="header"></div>

    <!-- ===== Membership Section ===== -->
    <section class="py-5 bg-light">
      <div class="container">
        <div class="text-center mb-5">
          <h2 class="fw-bold">Gym Membership</h2>
          <p class="text-muted">
            Choose your plan and start your fitness journey
          </p>
        </div>

        <div class="row justify-content-center">
          <div class="col-md-7">
            <div class="card shadow">
              <div class="card-body">
                <form onsubmit="return validateMembership()">
                  <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input
                      type="text"
                      id="name"
                      class="form-control"
                      placeholder="Enter your name"
                    />
                  </div>

                  <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input
                      type="email"
                      id="email"
                      class="form-control"
                      placeholder="Enter your email"
                    />
                  </div>

                  <div class="mb-3">
                    <label class="form-label">Mobile Number</label>
                    <input
                      type="number"
                      id="mobile"
                      class="form-control"
                      placeholder="Enter mobile number"
                    />
                  </div>

                  <div class="mb-3">
                    <label class="form-label">Select Plan</label>
                    <select
                      id="plan"
                      class="form-select"
                      onchange="calculatePrice()"
                    >
                      <option value="">-- Select Plan --</option>
                      <option value="1">1 Month - ₹1000</option>
                      <option value="3">3 Months - ₹2500</option>
                      <option value="6">6 Months - ₹4500</option>
                      <option value="12">12 Months - ₹8000</option>
                    </select>
                  </div>

                  <div class="mb-3">
                    <label class="form-label">Total Amount</label>
                    <input
                      type="text"
                      id="amount"
                      class="form-control"
                      readonly
                    />
                  </div>

                  <button type="submit" class="btn btn-danger w-100">
                    Join Membership
                  </button>
                </form>

                <div id="msg" class="text-center mt-3 fw-bold"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== Footer ===== -->
    <div id="footer"></div>

    <!-- For header footer -->
    <script src="../js/main.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript -->
    <script>
      function calculatePrice() {
        const plan = document.getElementById("plan").value;
        const amount = document.getElementById("amount");

        if (plan === "1") amount.value = "₹1000";
        else if (plan === "3") amount.value = "₹2500";
        else if (plan === "6") amount.value = "₹4500";
        else if (plan === "12") amount.value = "₹8000";
        else amount.value = "";
      }

      function validateMembership() {
        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const mobile = document.getElementById("mobile").value;
        const plan = document.getElementById("plan").value;
        const msg = document.getElementById("msg");

        if (name === "" || email === "" || mobile === "" || plan === "") {
          msg.innerHTML = "Please fill all details";
          msg.style.color = "red";
          return false;
        }

        msg.innerHTML = "Membership registered successfully!";
        msg.style.color = "green";

        return false; // backend nahi hai
      }
    </script>
  </body>
</html>
