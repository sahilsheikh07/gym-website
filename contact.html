<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Contact Us | Gym Fit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/contact.css" />
  </head>
  <body>
    <!-- ===== Navbar ===== -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="../index.html">GYM FIT</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navMenu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="../index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../programs.html">Programs</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../trainers.html">Trainers</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../bmi.html">BMI</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../membership.html">Membership</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="#">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- ===== Contact Section ===== -->
    <section class="py-5 bg-light">
      <div class="container">
        <div class="text-center mb-5">
          <h2 class="fw-bold">Contact Us</h2>
          <p class="text-muted">Get in touch with us</p>
        </div>

        <div class="row">
          <!-- Contact Info -->
          <div class="col-md-5 mb-4">
            <h5>Gym Fit</h5>
            <p>📍 Address: Main Road, Fitness City</p>
            <p>📞 Phone: +91 98765 43210</p>
            <p>✉ Email: info@gymfit.com</p>
            <p>🕒 Timings: 6:00 AM – 10:00 PM</p>
          </div>

          <!-- Contact Form -->
          <div class="col-md-7">
            <div class="card shadow">
              <div class="card-body">
                <h5 class="mb-4">Send Message</h5>

                <form onsubmit="return validateForm()">
                  <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input
                      type="text"
                      id="name"
                      class="form-control"
                      placeholder="Enter your name"
                    />
                  </div>

                  <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input
                      type="email"
                      id="email"
                      class="form-control"
                      placeholder="Enter your email"
                    />
                  </div>

                  <div class="mb-3">
                    <label class="form-label">Message</label>
                    <textarea
                      id="message"
                      class="form-control"
                      rows="4"
                      placeholder="Your message"
                    ></textarea>
                  </div>

                  <button type="submit" class="btn btn-danger w-100">
                    Send Message
                  </button>
                </form>

                <div id="formMsg" class="text-center mt-3 fw-bold"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== Footer ===== -->
    <footer class="bg-dark text-white text-center py-3">
      <p class="mb-0">© 2026 Gym Fit | All Rights Reserved</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript -->
    <script>
      function validateForm() {
        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const message = document.getElementById("message").value;
        const formMsg = document.getElementById("formMsg");

        if (name === "" || email === "" || message === "") {
          formMsg.innerHTML = "Please fill all fields";
          formMsg.style.color = "red";
          return false;
        }

        formMsg.innerHTML = "Message sent successfully!";
        formMsg.style.color = "green";

        // clear form
        document.getElementById("name").value = "";
        document.getElementById("email").value = "";
        document.getElementById("message").value = "";

        return false; // backend nahi hai
      }
    </script>
  </body>
</html>
