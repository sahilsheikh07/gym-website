<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #000000, #1a1a1a);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-card {
            background-color: #111;
            border-radius: 15px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 25px rgba(255, 102, 0, 0.4);
            border: 1px solid rgba(255, 102, 0, 0.3);
        }

        .login-title {
            color: #ff6600;
            font-weight: 700;
            text-align: center;
            font-size: larger;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .form-control {
            background-color: #1c1c1c;
            border: 1px solid #333;
            color: #fff;
        }

        .form-control:focus {
            border-color: #ff6600;
            box-shadow: 0 0 8px rgba(255, 102, 0, 0.5);
            background-color: #1c1c1c;
            color: #fff;
        }

        .btn-orange {
            background-color: #ff6600;
            border: none;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .btn-orange:hover {
            background-color: #e65c00;
        }

        .form-text a {
            color: #ff6600;
            text-decoration: none;
        }

        .form-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <h2 class="login-title">OXYGEN GYM LOGIN</h2>

        <form onsubmit="return handleLogin(event)">
            <div class="mb-3">
                <label class="form-label text-white">Email</label>
                <input type="email" class="form-control" placeholder="Enter your email" required>
            </div>

            <div class="mb-3">
                <label class="form-label text-white">Password</label>
                <input type="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-orange btn-lg">LOGIN</button>
            </div>

            <p class="form-text text-center mt-3 text-light">
                Not a member? <a href="signup.html">Join Now</a>
            </p>
        </form>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();

            // Yaha future me API login laga sakte ho

            // Redirect to home page
            window.location.href = "index.html"; // apne home page ka naam yaha daalna
        }
        function handleLogin(event) {
            event.preventDefault();

            const email = document.querySelector('input[type="email"]').value;

            // Demo ke liye fake name set kar rahe hain
            const user = {
                name: "Gym Member",
                email: email,
                phone: "Not Provided"
            };

            localStorage.setItem("gymUser", JSON.stringify(user));
            localStorage.setItem("isLoggedIn", "true");

            window.location.href = "index.html";
        }
    </script>

</body>

</html>
