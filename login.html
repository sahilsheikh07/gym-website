<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gym Login</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />

    <style>
      body {
        background: linear-gradient(135deg, #000000, #1a1a1a);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        padding: 20px;
      }

      .login-container {
        width: 100%;
        max-width: 450px;
      }

      .login-card {
        background-color: #111;
        border-radius: 15px;
        padding: 40px;
        box-shadow: 0 0 25px rgba(255, 102, 0, 0.4);
        border: 1px solid rgba(255, 102, 0, 0.3);
        position: relative;
      }

      /* Home Button */
      .home-btn {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(255, 102, 0, 0.2);
        border: 1px solid rgba(255, 102, 0, 0.3);
        color: #ff6600;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        transition: all 0.3s ease;
        font-size: 18px;
      }

      .home-btn:hover {
        background: rgba(255, 102, 0, 0.3);
        transform: scale(1.1);
        color: #fff;
        box-shadow: 0 0 10px rgba(255, 102, 0, 0.5);
      }

      .login-title {
        color: #ff6600;
        font-weight: 700;
        text-align: center;
        font-size: larger;
        margin-bottom: 25px;
        letter-spacing: 1px;
        padding-top: 10px;
      }

      .form-control {
        background-color: #1c1c1c;
        border: 1px solid #333;
        color: #fff;
        transition: all 0.3s ease;
      }

      .form-control:focus {
        border-color: #ff6600;
        box-shadow: 0 0 8px rgba(255, 102, 0, 0.5);
        background-color: #1c1c1c;
        color: #fff;
      }

      .btn-orange {
        background-color: #ff6600;
        border: none;
        font-weight: 600;
        letter-spacing: 1px;
        transition: all 0.3s ease;
        padding: 12px;
      }

      .btn-orange:hover {
        background-color: #e65c00;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(255, 102, 0, 0.4);
      }

      .btn-orange:active {
        transform: translateY(0);
      }

      .form-text a {
        color: #ff6600;
        text-decoration: none;
        font-weight: 500;
      }

      .form-text a:hover {
        text-decoration: underline;
      }

      /* Demo Credentials */
      .demo-credentials {
        background: rgba(255, 102, 0, 0.1);
        border: 1px solid rgba(255, 102, 0, 0.2);
        border-radius: 10px;
        padding: 15px;
        margin-top: 25px;
        color: #aaa;
        font-size: 14px;
      }

      .demo-title {
        color: #ff6600;
        font-weight: 600;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .demo-list {
        list-style: none;
        padding-left: 0;
        margin-bottom: 0;
      }

      .demo-list li {
        margin-bottom: 5px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .demo-list i {
        color: #ff6600;
        font-size: 12px;
      }

      /* Success Message */
      .success-message {
        background: rgba(40, 167, 69, 0.1);
        border: 1px solid rgba(40, 167, 69, 0.3);
        color: #28a745;
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 20px;
        display: none;
        align-items: center;
        gap: 10px;
        font-weight: 500;
      }

      /* Loading Animation */
      .loading {
        display: none;
        width: 20px;
        height: 20px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Responsive */
      @media (max-width: 480px) {
        .login-card {
          padding: 30px 25px;
        }

        .home-btn {
          top: 15px;
          left: 15px;
          width: 35px;
          height: 35px;
          font-size: 16px;
        }

        .login-title {
          font-size: 22px;
          margin-bottom: 20px;
        }
      }
    </style>
  </head>

  <body>
    <div class="login-container">
      <div class="login-card">
        <!-- Home Button -->
        <a href="index.html" class="home-btn" title="Go to Home">
          <i class="fas fa-home"></i>
        </a>

        <h2 class="login-title">OXYGEN GYM LOGIN</h2>

        <!-- Success Message -->
        <div class="success-message" id="successMessage">
          <i class="fas fa-check-circle"></i>
          <span id="messageText">Login successful! Redirecting...</span>
        </div>

        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label text-white">Email</label>
            <input
              type="email"
              class="form-control"
              placeholder="Enter your email"
              required
              id="emailInput"
            />
          </div>

          <div class="mb-3">
            <label class="form-label text-white">Password</label>
            <input
              type="password"
              class="form-control"
              placeholder="Enter your password"
              required
              id="passwordInput"
            />
          </div>

          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-orange btn-lg" id="loginBtn">
              <span id="btnText">LOGIN</span>
              <div class="loading" id="loadingSpinner"></div>
            </button>
          </div>

          <p class="form-text text-center mt-3 text-light">
            Not a member? <a href="signup.html">Join Now</a>
          </p>
        </form>

        <!-- Demo Credentials -->
        <div class="demo-credentials">
          <div class="demo-title">
            <i class="fas fa-info-circle"></i>
            <span>Demo Login</span>
          </div>
          <ul class="demo-list">
            <li>
              <i class="fas fa-check"></i>
              Enter any email and password
            </li>
            <li>
              <i class="fas fa-user"></i>
              Name will be saved from signup data
            </li>
            <li>
              <i class="fas fa-key"></i>
              Try: demo@oxygengym.com / anypassword
            </li>
          </ul>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const loginForm = document.getElementById("loginForm");
        const emailInput = document.getElementById("emailInput");
        const passwordInput = document.getElementById("passwordInput");
        const loginBtn = document.getElementById("loginBtn");
        const btnText = document.getElementById("btnText");
        const loadingSpinner = document.getElementById("loadingSpinner");
        const successMessage = document.getElementById("successMessage");
        const messageText = document.getElementById("messageText");

        // Pre-fill demo email for testing
        emailInput.value = "demo@oxygengym.com";
        passwordInput.value = "demo123";

        loginForm.addEventListener("submit", function (event) {
          event.preventDefault();

          const email = emailInput.value.trim();
          const password = passwordInput.value;

          if (!email || !password) {
            alert("Please enter both email and password");
            return;
          }

          // Show loading state
          loginBtn.disabled = true;
          btnText.textContent = "Logging in...";
          loadingSpinner.style.display = "inline-block";

          // Simulate API call delay
          setTimeout(function () {
            // First check if there's existing user data from signup
            const existingUser = localStorage.getItem("gymUser");
            let user;

            if (existingUser) {
              // Use the existing user data from signup
              user = JSON.parse(existingUser);
              user.email = email; // Update email if changed
            } else {
              // Create new user with name extracted from email
              const nameFromEmail = extractNameFromEmail(email);

              user = {
                name: nameFromEmail,
                email: email,
                phone: "Not Provided",
                loginDate: new Date().toISOString(),
                isFromLogin: true,
              };
            }

            // Save user to localStorage (this will overwrite existing)
            localStorage.setItem("gymUser", JSON.stringify(user));
            localStorage.setItem("isLoggedIn", "true");

            // Show success message
            messageText.textContent = `Welcome back, ${user.name}! Redirecting...`;
            successMessage.style.display = "flex";

            // Hide form
            loginForm.style.opacity = "0.6";
            loginForm.style.pointerEvents = "none";

            // Redirect after delay
            setTimeout(function () {
              window.location.href = "index.html";
            }, 1500);
          }, 1200); // Simulate network delay
        });

        // Function to extract name from email
        function extractNameFromEmail(email) {
          try {
            // Get the part before @
            const emailPart = email.split("@")[0];

            // Replace dots, underscores, and numbers with spaces
            const cleanPart = emailPart.replace(/[._0-9]/g, " ");

            // Capitalize first letter of each word
            const name = cleanPart
              .split(" ")
              .filter((word) => word.length > 0)
              .map(
                (word) =>
                  word.charAt(0).toUpperCase() + word.slice(1).toLowerCase(),
              )
              .join(" ");

            // If name is valid, return it
            if (name && name.length >= 2) {
              return name;
            }
          } catch (e) {
            console.log("Error extracting name:", e);
          }

          // Default name if extraction fails
          return "Gym Member";
        }

        // Check if already logged in
        const isLoggedIn = localStorage.getItem("isLoggedIn");
        if (isLoggedIn === "true") {
          // If already logged in, redirect to home
          window.location.href = "index.html";
        }

        // Add focus effect to inputs
        const inputs = document.querySelectorAll(".form-control");
        inputs.forEach((input) => {
          input.addEventListener("focus", function () {
            this.style.transform = "scale(1.02)";
          });

          input.addEventListener("blur", function () {
            this.style.transform = "scale(1)";
          });
        });
      });
    </script>
  </body>
</html>
