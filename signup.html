<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Sign Up</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .signup-card {
            background-color: #111;
            border-radius: 15px;
            padding: 35px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 0 25px rgba(255, 102, 0, 0.4);
            border: 1px solid rgba(255, 102, 0, 0.3);
            margin-top: 10px;
            /* margin-bottom: 70px; */
        }

        .signup-title {
            color: #ff6600;
            font-weight: 700;
            font-size: larger;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .form-control {
            background-color: #1c1c1c;
            border: 1px solid #333;
            color: #fff;
        }

        .form-control:focus {
            border-color: #ff6600;
            box-shadow: 0 0 8px rgba(255, 102, 0, 0.5);
            background-color: #1c1c1c;
            color: #fff;
        }

        .btn-orange {
            background-color: #ff6600;
            border: none;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .btn-orange:hover {
            background-color: #e65c00;
        }

        .form-text a {
            color: #ff6600;
            text-decoration: none;
        }

        .form-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center"
    style="background: linear-gradient(135deg, #000000, #1a1a1a); min-height: 100vh;">

    <div class="signup-card">
        <h2 class="signup-title">JOIN OUR GYM</h2>

        <form onsubmit="return handleSignup(event)">
            <div class="mb-3">
                <label class="form-label text-white">Full Name</label>
                <input type="text" class="form-control" placeholder="Enter your full name" required>
            </div>

            <div class="mb-3">
                <label class="form-label text-white">Email</label>
                <input type="email" class="form-control" placeholder="Enter your email" required>
            </div>

            <div class="mb-3">
                <label class="form-label text-white">Password</label>
                <input type="password" class="form-control" placeholder="Create a password" required>
            </div>

            <div class="mb-3">
                <label class="form-label text-white">Confirm Password</label>
                <input type="password" class="form-control" placeholder="Confirm password" required>
            </div>

            <div class="d-grid mt-3">
                <button type="submit" class="btn btn-orange btn-lg">SIGN UP</button>
            </div>

            <p class="form-text text-center mt-3 text-light">
                Already a member? <a href="login.html">Login</a>
            </p>
        </form>
    </div>

    <script>
        function handleSignup(event) {
            event.preventDefault();
            window.location.href = "index.html";
        }
        function handleSignup(event) {
            event.preventDefault();

            const name = document.querySelector('input[type="text"]').value;
            const email = document.querySelector('input[type="email"]').value;
            const phone = document.querySelector('input[type="tel"]').value;

            const user = {
                name: name,
                email: email,
                phone: phone
            };

            localStorage.setItem("gymUser", JSON.stringify(user));
            localStorage.setItem("isLoggedIn", "true");

            window.location.href = "index.html";
        }
    </script>

</body>

</html>
